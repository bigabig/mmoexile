# Local infrastructure and the full realm.
#   pnpm db:up      → Postgres + Redis only (for `pnpm dev`)
#   pnpm realm:up   → everything below, built from this repository
#
# Topology (Stage 3): account-api, social, the orchestrator, instance servers
# that register with it, and the client. Instance servers are reached
# directly by the browser, so their WebSocket ports are published; their
# internal ports (orchestrator calls, metrics) are not.
#
# The ticket keys below are for this local setup only (committed on
# purpose); override them via the environment for anything shared.
name: mmoexile

x-realm-env: &realm-env
  DATABASE_URL: postgresql://mmoexile:mmoexile@postgres:5432/mmoexile
  REDIS_URL: redis://redis:6379
  SOCIAL_URL: http://social:3002
  ORCHESTRATOR_URL: http://orchestrator:3003
  SESSION_SECRET: ${SESSION_SECRET:-compose-local-session-secret-change-me-0001}
  TICKET_PUBLIC_KEY: ${TICKET_PUBLIC_KEY:-MCowBQYDK2VwAyEA5x4WebokiBgXkMaoYISP5jTRPohe07UOHtwHccapyJw=}

x-node-service: &node-service
  restart: unless-stopped
  profiles: [realm]
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy

x-health: &health
  interval: 3s
  timeout: 3s
  retries: 20

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mmoexile
      POSTGRES_PASSWORD: mmoexile
      POSTGRES_DB: mmoexile
    ports:
      - "${MMOEXILE_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmoexile -d mmoexile"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7
    ports:
      - "${MMOEXILE_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Applies Prisma migrations once, then exits
  migrate:
    profiles: [realm]
    build:
      context: ../..
      dockerfile: infra/docker/node.Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgresql://mmoexile:mmoexile@postgres:5432/mmoexile
    depends_on:
      postgres:
        condition: service_healthy

  account-api:
    <<: *node-service
    build:
      context: ../..
      dockerfile: infra/docker/node.Dockerfile
      args: { APP: account-api }
    environment:
      <<: *realm-env
      PORT: "3000"
    ports: ["3000:3000"]
    healthcheck:
      <<: *health
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]

  social:
    <<: *node-service
    build:
      context: ../..
      dockerfile: infra/docker/node.Dockerfile
      args: { APP: social }
    environment:
      <<: *realm-env
      PORT: "3002"
    healthcheck:
      <<: *health
      test: ["CMD", "node", "-e", "fetch('http://localhost:3002/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]

  orchestrator:
    <<: *node-service
    build:
      context: ../..
      dockerfile: infra/docker/node.Dockerfile
      args: { APP: orchestrator }
    environment:
      <<: *realm-env
      PORT: "3003"
      TICKET_PRIVATE_KEY: ${TICKET_PRIVATE_KEY:-MC4CAQAwBQYDK2VwBCIEIOHkkKV+F4K0ZaOGcbZMuTdQefvVi0gcF9rNxIfS7wBZ}
    # Published on localhost only, for inspecting and draining the fleet.
    ports: ["127.0.0.1:3003:3003"]
    healthcheck:
      <<: *health
      test: ["CMD", "node", "-e", "fetch('http://localhost:3003/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]

  instance-server-a:
    <<: *node-service
    build: &instance-build
      context: ../..
      dockerfile: infra/docker/node.Dockerfile
      args: { APP: instance-server }
    environment:
      <<: *realm-env
      SERVER_ID: a
      PORT: "7001"
      PUBLIC_URL: ws://localhost:7001/ws
      INTERNAL_URL: http://instance-server-a:9001
    ports: ["7001:7001"]
    healthcheck: &instance-health
      <<: *health
      test: ["CMD", "node", "-e", "fetch('http://localhost:'+process.env.PORT+'/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]

  instance-server-b:
    <<: *node-service
    build: *instance-build
    environment:
      <<: *realm-env
      SERVER_ID: b
      PORT: "7002"
      PUBLIC_URL: ws://localhost:7002/ws
      INTERNAL_URL: http://instance-server-b:9001
    ports: ["7002:7002"]
    healthcheck: *instance-health

  client:
    profiles: [realm]
    build:
      context: ../..
      dockerfile: infra/docker/client.Dockerfile
    ports: ["8080:80"]
    depends_on:
      account-api:
        condition: service_healthy

volumes:
  postgres-data:
