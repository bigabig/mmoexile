# The databases outside the cluster (pnpm cluster-db:up: Docker containers
# on kind's network), under stable in-cluster names, like a cloud's managed
# databases: Services without a selector, so Kubernetes doesn't look for
# pods; their addresses (EndpointSlices) are set by the scripts
# (apply_db_endpoints in scripts/lib.sh) from the containers' addresses.
# The servers' certificates are issued for these names (cluster:init).
#
#   pgbouncer:6432  the services (mmoexile_app), pooled
#   postgres:5432   the migrate Job (mmoexile_migrate), direct
#   redis:6380      leases, presence, parties, pub/sub (TLS only)
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer
  labels: { app.kubernetes.io/name: pgbouncer, app.kubernetes.io/component: data }
spec:
  ports: [{ name: postgres, port: 6432 }]
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels: { app.kubernetes.io/name: postgres, app.kubernetes.io/component: data }
spec:
  ports: [{ name: postgres, port: 5432 }]
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels: { app.kubernetes.io/name: redis, app.kubernetes.io/component: data }
spec:
  ports: [{ name: redis, port: 6380 }]
---
# The databases' metrics exporters (cluster-db-up.sh), scraped by the
# cluster's Prometheus like everything else: Services without a selector
# (addresses from apply_db_endpoints) and a ServiceMonitor for all three.
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
  labels: { app.kubernetes.io/name: postgres-exporter, app.kubernetes.io/component: data, mmoexile.dev/metrics: database }
spec:
  ports: [{ name: metrics, port: 9187 }]
---
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer-exporter
  labels: { app.kubernetes.io/name: pgbouncer-exporter, app.kubernetes.io/component: data, mmoexile.dev/metrics: database }
spec:
  ports: [{ name: metrics, port: 9127 }]
---
apiVersion: v1
kind: Service
metadata:
  name: redis-exporter
  labels: { app.kubernetes.io/name: redis-exporter, app.kubernetes.io/component: data, mmoexile.dev/metrics: database }
spec:
  ports: [{ name: metrics, port: 9121 }]
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: databases
  labels: { app.kubernetes.io/name: databases }
spec:
  selector:
    matchLabels: { mmoexile.dev/metrics: database }
  endpoints:
    - port: metrics
      interval: 5s
      # job="postgres-exporter" etc., as in compose
      relabelings:
        - { sourceLabels: [__meta_kubernetes_service_name], targetLabel: job }
