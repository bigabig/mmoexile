# What every cluster of the local realm shares (a kustomize Component,
# included by overlays/central, overlays/eu and overlays/us): the databases
# next to the clusters (pnpm cluster-db:up) and the CA their certificates
# are signed by.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - databases.yaml
generatorOptions:
  labels: { app.kubernetes.io/component: config }
configMapGenerator:
  # The local CA (cluster:init) that signed the databases' certificates;
  # Prisma (sslcert in the URLs) and ioredis verify the servers against it
  - name: database-ca
    files:
      - ca.crt=../../.secrets/ca.crt
  - name: realm
    behavior: merge
    literals:
      - REDIS_CA_FILE=/etc/mmoexile/database-ca/ca.crt
