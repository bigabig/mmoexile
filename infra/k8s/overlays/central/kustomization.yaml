# The realm's central part on the local cluster "central"
# (infra/k8s/kind-central.yaml): which ports reach the host, where the
# databases are, the generated secrets and the region list.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mmoexile
resources:
  - ../../base/central
  - databases.yaml
components:
  - ../kind-common

# Generated ConfigMaps/Secrets are applied with the data (scripts/apply.sh)
generatorOptions:
  labels: { app.kubernetes.io/component: config }
configMapGenerator:
  # The realm's regions as the browser reaches them: each region gateway's
  # host port on its cluster's node (kind-eu.yaml, kind-us.yaml)
  - name: realm-regions
    literals:
      - REGIONS=eu=Europe=http://localhost:7350/ping,us=North America=http://localhost:7450/ping

secretGenerator:
  # Generated by pnpm cluster:init into infra/k8s/.secrets/ (git-ignored),
  # nothing secret is committed. connections-central.env (the connection
  # URLs with their passwords) is written from those files by
  # scripts/apply.sh.
  - name: realm-secrets
    files:
      - SESSION_SECRET=../../.secrets/session-secret
      - TICKET_PUBLIC_KEY=../../.secrets/ticket-public-key
      - TICKET_PRIVATE_KEY=../../.secrets/ticket-private-key
    envs:
      - ../../.secrets/connections-central.env

patches:
  # Reachable from the host through the node's port mappings
  - target: { kind: Service, name: client }
    patch: |
      - { op: add, path: /spec/type, value: NodePort }
      - { op: add, path: /spec/ports/0/nodePort, value: 30090 }
  - target: { kind: Service, name: orchestrator }
    patch: |
      - { op: add, path: /spec/type, value: NodePort }
      - { op: add, path: /spec/ports/0/nodePort, value: 30013 }
