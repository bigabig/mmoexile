---
apiVersion: autoscaling.agones.dev/v1
kind: FleetAutoscaler
metadata:
  name: instance-server-eu
  labels: { app.kubernetes.io/name: instance-server, mmoexile.dev/region: eu }
spec:
  fleetName: instance-server-eu
  # Keep 200 free player slots across the fleet, within 400-800 slots in
  # total (whole servers, so a multiple of the capacity per server)
  policy:
    type: Counter
    counter:
      key: players
      bufferSize: 200
      minCapacity: 400
      maxCapacity: 800
  sync:
    type: FixedInterval
    fixedInterval: { seconds: 10 }
---
apiVersion: autoscaling.agones.dev/v1
kind: FleetAutoscaler
metadata:
  name: instance-server-us
  labels: { app.kubernetes.io/name: instance-server, mmoexile.dev/region: us }
spec:
  fleetName: instance-server-us
  # Keep 200 free player slots across the fleet, within 200-600 slots in
  # total (whole servers, so a multiple of the capacity per server)
  policy:
    type: Counter
    counter:
      key: players
      bufferSize: 200
      minCapacity: 200
      maxCapacity: 600
  sync:
    type: FixedInterval
    fixedInterval: { seconds: 10 }
