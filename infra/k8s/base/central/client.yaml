# The game client: static files plus the /api and /directory proxies
# (the same image as compose; upstreams and DNS resolver via environment).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  labels: { app.kubernetes.io/name: client, app.kubernetes.io/component: central }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: client }
  template:
    metadata:
      labels: { app.kubernetes.io/name: client, app.kubernetes.io/component: central }
      annotations:
        # Browsers connect to port 80 (a NodePort), outside the mesh; the
        # client's calls to account-api and directory go through it
        config.linkerd.io/skip-inbound-ports: "80"
    spec:
      serviceAccountName: client
      containers:
        - name: client
          image: mmoexile/client:dev
          imagePullPolicy: IfNotPresent
          env:
            # nginx resolves names itself, without the pod's search domains,
            # so the upstreams need their full names (<service>.<namespace>.svc...)
            - { name: NGINX_RESOLVER, value: kube-dns.kube-system.svc.cluster.local }
            - { name: ACCOUNT_API_UPSTREAM, value: account-api.mmoexile.svc.cluster.local:3000 }
            - { name: DIRECTORY_UPSTREAM, value: directory.mmoexile.svc.cluster.local:3004 }
          ports: [{ name: http, containerPort: 80 }]
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: client
  labels: { app.kubernetes.io/name: client }
spec:
  selector: { app.kubernetes.io/name: client }
  ports: [{ name: http, port: 80, targetPort: http }]
---
# Its identity in the mesh (D32): Linkerd issues the pod a certificate for
# client.mmoexile.serviceaccount.identity.linkerd.cluster.local, which
# the policies (policies.yaml) authorize. It doesn't call the Kubernetes
# API, so it gets no API token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: client
  labels: { app.kubernetes.io/name: client }
automountServiceAccountToken: false
