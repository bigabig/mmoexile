# Chat, presence and parties across instance servers.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: social
  labels: { app.kubernetes.io/name: social, app.kubernetes.io/component: central }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: social }
  template:
    metadata:
      labels: { app.kubernetes.io/name: social, app.kubernetes.io/component: central }
    spec:
      serviceAccountName: social
      containers:
        - name: social
          image: mmoexile/social:dev
          imagePullPolicy: IfNotPresent  # loaded into the nodes, never pulled
          envFrom:
            - configMapRef: { name: realm }
          env:
            - { name: PORT, value: "3002" }
            - name: REDIS_URL
              valueFrom: { secretKeyRef: { name: realm-secrets, key: REDIS_URL } }
          ports: [{ name: http, containerPort: 3002 }]
          # Restarted if it stops answering; gets traffic only when ready
          # (its dependencies are reachable)
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 3
          # tsx compiles the TypeScript sources on start, which takes a few seconds
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 2
            failureThreshold: 60
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 768Mi }
          volumeMounts:
            - { name: database-ca, mountPath: /etc/mmoexile/database-ca, readOnly: true }
      volumes:
        # The CA the databases' certificates are signed by (from the overlay)
        - { name: database-ca, configMap: { name: database-ca } }
---
# Exported to the regions' clusters (parties): mirrored there as
# social-central by Linkerd multicluster
apiVersion: v1
kind: Service
metadata:
  name: social
  labels: { app.kubernetes.io/name: social, mirror.linkerd.io/exported: "true" }
spec:
  selector: { app.kubernetes.io/name: social }
  ports: [{ name: http, port: 3002, targetPort: http }]
---
# Its identity in the mesh (D32): Linkerd issues the pod a certificate for
# social.mmoexile.serviceaccount.identity.linkerd.cluster.local, which
# the policies (policies.yaml) authorize. It doesn't call the Kubernetes
# API, so it gets no API token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: social
  labels: { app.kubernetes.io/name: social }
automountServiceAccountToken: false
