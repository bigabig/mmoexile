# The global entry point: realms and their regions (GET /realms).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: directory
  labels: { app.kubernetes.io/name: directory, app.kubernetes.io/component: central }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: directory }
  template:
    metadata:
      labels: { app.kubernetes.io/name: directory, app.kubernetes.io/component: central }
    spec:
      serviceAccountName: directory
      containers:
        - name: directory
          image: mmoexile/directory:dev
          imagePullPolicy: IfNotPresent  # loaded into the nodes, never pulled
          env:
            - { name: PORT, value: "3004" }
            - { name: REALM_NAME, value: "Standard" }
            - name: REGIONS
              valueFrom: { configMapKeyRef: { name: realm-regions, key: REGIONS } }
          ports: [{ name: http, containerPort: 3004 }]
          # Restarted if it stops answering; gets traffic only when ready
          # (its dependencies are reachable)
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 3
          # tsx compiles the TypeScript sources on start, which takes a few seconds
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 2
            failureThreshold: 60
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 768Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: directory
  labels: { app.kubernetes.io/name: directory }
spec:
  selector: { app.kubernetes.io/name: directory }
  ports: [{ name: http, port: 3004, targetPort: http }]
---
# Its identity in the mesh (D32): Linkerd issues the pod a certificate for
# directory.mmoexile.serviceaccount.identity.linkerd.cluster.local, which
# the policies (policies.yaml) authorize. It doesn't call the Kubernetes
# API, so it gets no API token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: directory
  labels: { app.kubernetes.io/name: directory }
automountServiceAccountToken: false
