# Applies Prisma migrations once (the migrate image, as in compose), as the
# database user that owns the schema (MIGRATE_DATABASE_URL); the services
# use one that can't change it. Postgres and Redis themselves aren't part
# of the realm's manifests: they run outside the cluster (the overlay says
# where). Labelled component=data: scripts/apply.sh runs this first, then
# starts the services.
#
# A Job can't be changed after it was created, so scripts/apply.sh deletes
# the previous one first.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  labels: { app.kubernetes.io/name: migrate, app.kubernetes.io/component: data }
spec:
  backoffLimit: 10  # retries while the database is unreachable
  template:
    metadata:
      labels: { app.kubernetes.io/name: migrate }
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: mmoexile/migrate:dev
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: realm-secrets, key: MIGRATE_DATABASE_URL } }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: database-ca, mountPath: /etc/mmoexile/database-ca, readOnly: true }
      volumes:
        # The CA the databases' certificates are signed by (from the overlay)
        - { name: database-ca, configMap: { name: database-ca } }
