# The region's entry point (Stage 7, D31): how the central cluster reaches
# this region's instance servers. Only reachable through the mesh: the
# central cluster sees this port as the Service region-gateway-<region>,
# mirrored by Linkerd multicluster through the clusters' gateways.
#
#   POST http://region-gateway-eu:9000/servers/<server id>/instances
#     → http://<server id>.instance-servers.mmoexile.svc.cluster.local:9001/instances
#
# A server's id is its pod's name (the GameServer's), and the headless
# Service instance-servers gives every pod that DNS name. Instance servers
# register http://region-gateway-<region>:9000/servers/<id> as their
# internal URL, so the orchestrator needs no knowledge of clusters.
server {
  listen 9000;
  # Names are resolved per request (they change as servers come and go)
  resolver kube-dns.kube-system.svc.cluster.local valid=5s ipv6=off;

  location ~ ^/servers/(?<server>[a-z0-9-]+)(?<path>/.*)$ {
    proxy_pass http://$server.instance-servers.mmoexile.svc.cluster.local:9001$path$is_args$args;
    proxy_http_version 1.1;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
  }

  location / {
    return 404;
  }
}
