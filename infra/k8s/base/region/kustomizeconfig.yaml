# Teaches kustomize where Agones resources reference others, so generated
# names (ConfigMaps and Secrets with their content hash) and renamed ones
# are filled in there too.
nameReference:
  - kind: ConfigMap
    fieldSpecs:
      - { kind: Fleet, path: spec/template/spec/template/spec/containers/envFrom/configMapRef/name }
      - { kind: Fleet, path: spec/template/spec/template/spec/containers/env/valueFrom/configMapKeyRef/name }
      - { kind: Fleet, path: spec/template/spec/template/spec/volumes/configMap/name }
  - kind: Secret
    fieldSpecs:
      - { kind: Fleet, path: spec/template/spec/template/spec/containers/env/valueFrom/secretKeyRef/name }
  # A FleetAutoscaler names its Fleet, which the overlay renames per region
  - kind: Fleet
    fieldSpecs:
      - { kind: FleetAutoscaler, path: spec/fleetName }
