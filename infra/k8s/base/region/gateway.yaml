# The region's gateway: answers GET /ping from the region's network
# position, so the browser measures its latency to that region (Stage 4).
# The overlay gives it a host port on the region's node.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: region-gateway
  labels: { app.kubernetes.io/name: region-gateway, app.kubernetes.io/component: gateway }
spec:
  replicas: 1
  strategy: { type: Recreate }  # a host port can't be held by two pods
  selector:
    matchLabels: { app.kubernetes.io/name: region-gateway }
  template:
    metadata:
      labels: { app.kubernetes.io/name: region-gateway, app.kubernetes.io/component: gateway }
      annotations:
        # Browsers ping port 80 (a host port), outside the mesh
        config.linkerd.io/skip-inbound-ports: "80"
    spec:
      containers:
        - name: nginx
          image: nginx:1.29-alpine
          ports: [{ name: http, containerPort: 80 }]
          readinessProbe:
            httpGet: { path: /ping, port: http }
            periodSeconds: 5
          resources:
            requests: { cpu: 20m, memory: 16Mi }
            limits: { memory: 64Mi }
          volumeMounts:
            - { name: config, mountPath: /etc/nginx/conf.d }
      volumes:
        - { name: config, configMap: { name: gateway-nginx } }
