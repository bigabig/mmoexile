# A region's instance servers as an Agones Fleet (Stage 5). Agones keeps
# the number of GameServers (pods) a FleetAutoscaler asks for, replaces
# unhealthy ones and never removes Allocated (= in use) ones; the
# orchestrator (in the cluster "central") still decides which server a
# player goes to (D13).
#
# Region-neutral: the overlay (overlays/eu, overlays/us) names the Fleet
# after its region (instance-server-eu: its GameServers' names, which are
# the servers' ids, stay unique across clusters) and sets REGION, the port
# range and the capacity.
apiVersion: agones.dev/v1
kind: Fleet
metadata:
  name: instance-server
  labels: { app.kubernetes.io/name: instance-server }
spec:
  replicas: 1  # the FleetAutoscaler takes over from here
  # Fill servers before using new ones; scale-down removes the emptiest
  scheduling: Packed
  template:
    metadata:
      labels: { app.kubernetes.io/name: instance-server }
    spec:
      # One host port from the region's range (Agones' Helm values), mapped
      # to the WebSocket port; players connect to it directly.
      ports:
        - { name: game, range: REGION, containerPort: 7777, protocol: TCP }
      # Unhealthy (and replaced) after missing health pings for 3 × 5 s;
      # the first ping comes once the server is listening and registered.
      health:
        initialDelaySeconds: 30
        periodSeconds: 5
        failureThreshold: 3
      # Free player slots per server, the FleetAutoscaler's measure. The
      # server sets the capacity (CAPACITY, default 200) and keeps the
      # count current.
      counters:
        players: { count: 0, capacity: 200 }
      template:
        metadata:
          labels: { app.kubernetes.io/name: instance-server, app.kubernetes.io/component: game }
          annotations:
            # Players connect to the game port directly (a host port), not
            # through the mesh; the internal API (9001) is meshed
            config.linkerd.io/skip-inbound-ports: "7777"
        spec:
          # A DNS name per server: Agones sets the pod's hostname to the
          # GameServer's name, the headless Service below adds the domain:
          # <name>.instance-servers.mmoexile.svc.cluster.local (used by the
          # region's entry point)
          subdomain: instance-servers
          # SIGTERM starts the drain (DRAIN_TIMEOUT_SEC plus moving players)
          terminationGracePeriodSeconds: 120
          containers:
            - name: instance-server
              image: mmoexile/instance-server:dev
              imagePullPolicy: IfNotPresent
              envFrom:
                - configMapRef: { name: realm }
              env:
                - { name: LIFECYCLE, value: agones }
                - { name: REGION, value: REGION }
                - { name: PORT, value: "7777" }
                - { name: INTERNAL_PORT, value: "9001" }
                - { name: DRAIN_TIMEOUT_SEC, value: "60" }
                - name: REDIS_URL
                  valueFrom: { secretKeyRef: { name: realm-secrets, key: REDIS_URL } }
                # Downward API: the pod's (= GameServer's) name
                - name: SERVER_ID
                  valueFrom: { fieldRef: { fieldPath: metadata.name } }
                # How the orchestrator (central cluster) reaches this
                # server: through the region's entry point (the overlay
                # names the region)
                - { name: INTERNAL_URL, value: "http://region-gateway-REGION:9000/servers/$(SERVER_ID)" }
                - name: DATABASE_URL
                  valueFrom: { secretKeyRef: { name: realm-secrets, key: DATABASE_URL } }
                # Connections per server (Prisma's pool): periodic saves and
                # logins, one statement each; see "Connection budget" in
                # infra/k8s/README.md
                - { name: DATABASE_POOL_SIZE, value: "3" }
                - name: TICKET_PUBLIC_KEY
                  valueFrom: { secretKeyRef: { name: realm-secrets, key: TICKET_PUBLIC_KEY } }
              ports:
                - { name: internal, containerPort: 9001 }
              resources:
                requests: { cpu: 250m, memory: 256Mi }
                limits: { memory: 1Gi }
              volumeMounts:
                - { name: database-ca, mountPath: /etc/mmoexile/database-ca, readOnly: true }
          volumes:
            # The CA the databases' certificates are signed by (from the overlay)
            - { name: database-ca, configMap: { name: database-ca } }
---
# Headless (no virtual IP): DNS answers with the pods themselves, and each
# pod gets its own name (see subdomain above)
apiVersion: v1
kind: Service
metadata:
  name: instance-servers
  labels: { app.kubernetes.io/name: instance-server }
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: instance-server }
  ports: [{ name: internal, port: 9001 }]
---
apiVersion: autoscaling.agones.dev/v1
kind: FleetAutoscaler
metadata:
  name: instance-server
  labels: { app.kubernetes.io/name: instance-server }
spec:
  fleetName: instance-server
  # Keep 200 free player slots across the fleet, within 200-600 slots in
  # total (whole servers, so a multiple of the capacity per server)
  policy:
    type: Counter
    counter:
      key: players
      bufferSize: 200
      minCapacity: 200
      maxCapacity: 600
  sync:
    type: FixedInterval
    fixedInterval: { seconds: 10 }
