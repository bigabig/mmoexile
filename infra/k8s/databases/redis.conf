# Redis next to the cluster: TLS only, one ACL user, no persistence.
# The users (with the generated password) are in /tls/users.acl, written by
# cluster-db-up.sh.

# No plain-text port, only TLS
port 0
tls-port 6380
tls-cert-file /tls/server.crt
tls-key-file /tls/server.key
tls-ca-cert-file /tls/ca.crt
# Clients authenticate with a password, not a client certificate
tls-auth-clients no

aclfile /tls/users.acl

# Short-lived state only (leases expire, presence and parties are rebuilt),
# as in compose: nothing is written to disk
save ""
appendonly no
dir /tmp
