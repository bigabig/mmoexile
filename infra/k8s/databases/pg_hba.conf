# Who may connect to Postgres, and how (first matching line wins).
#
# TYPE    DATABASE  USER      ADDRESS    METHOD
# The superuser only from inside the container (docker exec … psql)
local     all       postgres             trust
hostssl   all       postgres  all        reject
# Everyone else over the network: TLS and a password (SCRAM), never in
# plain text. No "host" line, so a connection without TLS is refused.
hostssl   mmoexile  all       all        scram-sha-256
