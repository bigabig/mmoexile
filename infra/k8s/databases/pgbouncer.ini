; PgBouncer next to Postgres: in Postgres' container's network namespace,
; so it reaches Postgres on localhost (no simulated distance in between)
; and shares its address. The services connect here, as mmoexile_app.
[databases]
mmoexile = host=localhost port=5432 dbname=mmoexile

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir =

; Clients: TLS required, password (SCRAM) from the userlist that
; cluster-db-up.sh writes from the generated passwords
client_tls_sslmode = require
client_tls_cert_file = /tls/server.crt
client_tls_key_file = /tls/server.key
auth_type = scram-sha-256
auth_file = /tls/userlist.txt
; The exporter reads SHOW STATS/POOLS from the admin console ("pgbouncer")
stats_users = mmoexile_monitor

; Towards Postgres: TLS with full certificate verification
server_tls_sslmode = verify-full
server_tls_ca_file = /tls/ca.crt

; Transaction pooling: a server connection belongs to a client only for the
; duration of one transaction, so many client connections share few server
; connections. Session state (SET, advisory locks, LISTEN) doesn't survive
; between transactions; our services don't use any (one statement per
; transaction, see CharacterOwnership).
pool_mode = transaction

; The connection budget (also in infra/k8s/README.md):
;   clients   account-api 2 pods × 5 + instance servers at the fleets'
;             maximum (eu 4 + 1 during a rolling update, us 3 + 1) × 3
;             = 10 + 27 = 37 client connections in the kind cluster;
;             max_client_conn leaves room for ~300 servers
;   servers   at most default_pool_size + reserve_pool_size = 25
;             connections to Postgres for mmoexile_app, however many
;             clients; max_db_connections = 30 caps the database
;   Postgres  max_connections 100 ≥ 30 (PgBouncer) + migrations (1)
;             + monitoring (at most 3) + 3 reserved for the superuser
max_client_conn = 1000
default_pool_size = 20
reserve_pool_size = 5
reserve_pool_timeout = 2
max_db_connections = 30
; A client waits at most this long for a server connection, then gets an
; error instead of hanging (e.g. while Postgres is down)
query_wait_timeout = 30
; Prepared statements (Prisma uses them) work across transactions
max_prepared_statements = 200

; Sent by some drivers on connect; harmless to ignore
ignore_startup_parameters = extra_float_digits,options

log_connections = 0
log_disconnections = 0
