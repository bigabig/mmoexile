; PgBouncer next to Postgres: in Postgres' container's network namespace,
; so it reaches Postgres on localhost (no simulated distance in between)
; and shares its address. The services connect here, as mmoexile_app.
[databases]
mmoexile = host=localhost port=5432 dbname=mmoexile

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir =

; Clients: TLS required, password (SCRAM) from the userlist that
; cluster-db-up.sh writes from the generated passwords
client_tls_sslmode = require
client_tls_cert_file = /tls/server.crt
client_tls_key_file = /tls/server.key
auth_type = scram-sha-256
auth_file = /tls/userlist.txt

; Towards Postgres: TLS with full certificate verification
server_tls_sslmode = verify-full
server_tls_ca_file = /tls/ca.crt

; Transaction pooling: a server connection belongs to a client only for the
; duration of one transaction, so many client connections share few server
; connections. Session state (SET, advisory locks, LISTEN) doesn't survive
; between transactions; our services don't use any. Pool sizes: see
; the connection budget in infra/k8s/README.md.
pool_mode = transaction
max_client_conn = 1000
default_pool_size = 20
reserve_pool_size = 5
reserve_pool_timeout = 2
max_db_connections = 40
; Prepared statements (Prisma uses them) work across transactions
max_prepared_statements = 200

; Sent by some drivers on connect; harmless to ignore
ignore_startup_parameters = extra_float_digits,options

log_connections = 0
log_disconnections = 0
