# Who may write into central's Prometheus (D32, D33; central only, applied
# by cluster-up.sh): the regions' agents, which arrive through this
# cluster's multicluster gateway (it lets in only the instance servers'
# and the agents' identities, and forwards with its own). Queries
# (Grafana, localhost:9091) stay open to anyone.
apiVersion: policy.linkerd.io/v1beta3
kind: Server
metadata: { name: prometheus, namespace: monitoring }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: prometheus } }
  port: http-web
  proxyProtocol: HTTP/1
---
apiVersion: policy.linkerd.io/v1alpha1
kind: MeshTLSAuthentication
metadata: { name: from-regions, namespace: monitoring }
spec:
  identityRefs: [{ kind: ServiceAccount, name: linkerd-gateway, namespace: linkerd-multicluster }]
---
apiVersion: policy.linkerd.io/v1alpha1
kind: NetworkAuthentication
metadata: { name: anyone, namespace: monitoring }
spec:
  networks: [{ cidr: 0.0.0.0/0 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: prometheus-write, namespace: monitoring }
spec:
  parentRefs: [{ group: policy.linkerd.io, kind: Server, name: prometheus }]
  rules:
    - matches: [{ path: { type: Exact, value: /api/v1/write }, method: POST }]
---
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata: { name: prometheus-write, namespace: monitoring }
spec:
  targetRef: { group: gateway.networking.k8s.io, kind: HTTPRoute, name: prometheus-write }
  requiredAuthenticationRefs: [{ group: policy.linkerd.io, kind: MeshTLSAuthentication, name: from-regions }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: prometheus-queries, namespace: monitoring }
spec:
  parentRefs: [{ group: policy.linkerd.io, kind: Server, name: prometheus }]
  rules:
    - matches: [{ path: { type: PathPrefix, value: / } }]
---
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata: { name: prometheus-queries, namespace: monitoring }
spec:
  targetRef: { group: gateway.networking.k8s.io, kind: HTTPRoute, name: prometheus-queries }
  requiredAuthenticationRefs: [{ group: policy.linkerd.io, kind: NetworkAuthentication, name: anyone }]
