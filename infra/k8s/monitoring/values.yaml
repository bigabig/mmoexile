# Helm values for kube-prometheus-stack (chart version pinned in
# scripts/lib.sh): Prometheus (run by the Prometheus Operator), Grafana,
# kube-state-metrics and node-exporter, plus their Kubernetes dashboards.
#
# Our services are scraped through PodMonitors
# (base/central/monitoring.yaml), the Realm Overview dashboard is the same
# file as in compose, loaded from a ConfigMap by Grafana's sidecar. This is the central cluster's
# monitoring; the regions run a smaller one (values-region.yaml).

# Local cluster: no alerting, and kind's control-plane components only
# listen on localhost, so they can't be scraped
alertmanager: { enabled: false }
kubeControllerManager: { enabled: false }
kubeScheduler: { enabled: false }
kubeEtcd: { enabled: false }
kubeProxy: { enabled: false }

prometheus:
  service:
    type: NodePort
    nodePort: 30091  # localhost:9091 (kind-central.yaml)
    # Exported to the regions (Linkerd multicluster): their Prometheus
    # agents write into it as monitoring-kube-prometheus-prometheus-central
    labels: { mirror.linkerd.io/exported: "true" }
  prometheusSpec:
    # Accepts the regions' metrics (remote write, /api/v1/write); who may
    # write is limited by the mesh (monitoring/remote-write-policy.yaml)
    enableRemoteWriteReceiver: true
    # Meshed: receives the regions' writes through the mesh, and scrapes
    # the meshed pods with its own identity
    podMetadata: { annotations: { linkerd.io/inject: enabled } }
    scrapeInterval: 5s  # as in compose
    evaluationInterval: 5s
    retention: 2d
    # Pick up every PodMonitor/ServiceMonitor in the cluster, not only the
    # ones labelled for this Helm release
    podMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    # Find a ServiceMonitor's targets through EndpointSlices (not the
    # deprecated Endpoints): the databases outside the cluster only have
    # EndpointSlices (overlays/central/databases.yaml)
    serviceDiscoveryRole: EndpointSlice

prometheus-node-exporter:
  # kind nodes are containers: no host root filesystem to mount
  hostRootFsMount: { enabled: false }

grafana:
  service:
    type: NodePort
    nodePort: 30040  # localhost:3040 (kind-central.yaml)
  adminPassword: admin  # local only; viewers need no login
  grafana.ini:
    auth.anonymous: { enabled: true, org_role: Viewer }
    analytics: { reporting_enabled: false, check_for_updates: false }
    # The sidecar writes each dashboard ConfigMap's files to /tmp/dashboards
    dashboards: { default_home_dashboard_path: /tmp/dashboards/realm-overview.json }
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
    datasources:
      # The UID the Realm Overview dashboard refers to (same as compose)
      uid: prometheus
