# Helm values for kube-prometheus-stack in a region's cluster (eu, us):
# the same chart as central (values.yaml), but only what collects metrics.
# Prometheus runs in agent mode (D33): it scrapes the region (instance
# servers, Agones, the mesh's proxies and links, the cluster itself), keeps
# nothing to query, and forwards the samples to central's Prometheus
# (remote write) through the mesh. No Grafana: dashboards are central's.

alertmanager: { enabled: false }
grafana: { enabled: false }
kubeControllerManager: { enabled: false }
kubeScheduler: { enabled: false }
kubeEtcd: { enabled: false }
kubeProxy: { enabled: false }

prometheus:
  agentMode: true
  prometheusSpec:
    scrapeInterval: 5s
    podMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceDiscoveryRole: EndpointSlice
    # Meshed: its writes to central go through the mesh (the mirrored
    # Service below, mTLS through both clusters' gateways)
    podMetadata: { annotations: { linkerd.io/inject: enabled } }
    # Every sample gets the region's cluster ("eu", "us"), set by
    # cluster-up.sh: externalLabels.cluster
    remoteWrite:
      - url: http://monitoring-kube-prometheus-prometheus-central:9090/api/v1/write
        # Only what central's dashboards use, not the whole cluster's
        # metrics: the realm's own, Agones', the mesh's (proxies and the
        # links' gateways), the agent's own remote-write state, and
        # whether targets are up
        writeRelabelConfigs:
          - sourceLabels: [__name__]
            regex: "mmoexile_.*|agones_.*|up|outbound_http_route_.*|inbound_http_authz_.*|inbound_http_route_.*|gateway_.*|prometheus_remote_storage_.*"
            action: keep

prometheus-node-exporter:
  hostRootFsMount: { enabled: false }
