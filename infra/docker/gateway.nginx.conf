# A region's gateway (Stage 4). For now it only answers pings: the browser
# measures the round trip to pick the fastest region. Later it may become
# the region's TLS/WebSocket entry point.
server {
  listen 80;

  location = /ping {
    add_header Access-Control-Allow-Origin * always;
    add_header Cache-Control no-store always;
    return 204;
  }

  location / {
    return 404;
  }
}
