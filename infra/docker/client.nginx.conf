server {
  listen 80;
  root /usr/share/nginx/html;

  # Resolve upstreams on every request (cached 10 s), so a recreated
  # account-api or directory (new IP) is found without restarting this one.
  # Needs proxy_pass with a variable. The ${...} values are filled in from
  # the environment when the container starts (nginx image templates):
  # Docker's DNS and service names in compose (the image's defaults), the
  # cluster DNS and full service names in Kubernetes.
  resolver ${NGINX_RESOLVER} valid=10s ipv6=off;

  # account-api: login, characters, play tickets (same path as the Vite proxy)
  location /api/ {
    set $account_api http://${ACCOUNT_API_UPSTREAM};
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $account_api;
    proxy_set_header X-Request-Id $request_id;
  }

  # directory: realms and their regions (same path as the Vite proxy)
  location /directory/ {
    set $directory http://${DIRECTORY_UPSTREAM};
    rewrite ^/directory/(.*)$ /$1 break;
    proxy_pass $directory;
    proxy_set_header X-Request-Id $request_id;
  }

  location / {
    try_files $uri /index.html;
  }
}
