server {
  listen 80;
  root /usr/share/nginx/html;

  # Resolve upstreams through Docker's DNS on every request (cached 10 s),
  # so a recreated account-api or directory container (new IP) is found
  # without restarting this one. Needs proxy_pass with a variable.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # account-api: login, characters, play tickets (same path as the Vite proxy)
  location /api/ {
    set $account_api http://account-api:3000;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $account_api;
    proxy_set_header X-Request-Id $request_id;
  }

  # directory: realms and their regions (same path as the Vite proxy)
  location /directory/ {
    set $directory http://directory:3004;
    rewrite ^/directory/(.*)$ /$1 break;
    proxy_pass $directory;
    proxy_set_header X-Request-Id $request_id;
  }

  location / {
    try_files $uri /index.html;
  }
}
